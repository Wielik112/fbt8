<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel administratora | FBT Outlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
:root{
  --black:#08080A; --black-2:#0F0F12; --surface:#141418; --surface-2:#1C1C22;
  --line:#26262E; --line-bright:#34343E;
  --red:#E01020; --red-hot:#FF1E2D; --red-deep:#8B0812; --red-glow:rgba(224,16,32,.35);
  --white:#fff; --grey-1:#C9C9D2; --grey-2:#8B8B96; --grey-3:#56565F;
  --green:#1FBF6B;
  --display:'Saira Condensed',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--black);color:var(--white);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
::selection{background:var(--red);color:#fff}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.5px;text-transform:uppercase}

/* ---- Top bar ---- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:16px 24px;background:rgba(15,15,18,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:30px;width:auto;display:block}
.brand-txt{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:1px}
.brand-txt span{color:var(--red)}
.brand-sub{font-size:11px;letter-spacing:2px;color:var(--grey-2);text-transform:uppercase;font-weight:600}
.top-actions{display:flex;align-items:center;gap:12px}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;
  font-weight:600;font-size:14px;transition:.2s var(--ease);white-space:nowrap;border:1px solid transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--red-hot);box-shadow:0 6px 24px -8px var(--red-glow)}
.btn-ghost{background:var(--surface-2);border-color:var(--line-bright);color:var(--grey-1)}
.btn-ghost:hover:not(:disabled){border-color:var(--grey-2);color:#fff}
.btn-danger{background:transparent;border-color:var(--red-deep);color:#ff8a92}
.btn-danger:hover:not(:disabled){background:var(--red-deep);color:#fff}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:8px}

/* ---- Shell ---- */
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.hidden{display:none!important}

/* ---- Login ---- */
.login-shell{min-height:calc(100vh - 63px);display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:34px 30px;box-shadow:0 30px 80px -40px #000}
.login-card h1{font-size:26px;margin-bottom:6px}
.login-card p{color:var(--grey-2);font-size:14px;margin:0 0 22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--grey-2);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;background:var(--black-2);
  border:1px solid var(--line-bright);border-radius:10px;color:#fff;font-size:14px;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--red);
  box-shadow:0 0 0 3px var(--red-glow)}
.field textarea{resize:vertical;min-height:44px}
.hint{font-size:12px;color:var(--grey-3);margin-top:6px}

/* ---- Notice / errors ---- */
.notice{padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px;border:1px solid}
.notice-err{background:rgba(224,16,32,.08);border-color:var(--red-deep);color:#ff9ba2}
.notice-ok{background:rgba(31,191,107,.08);border-color:#1a6b45;color:#7fe0af}

/* ---- Page head ---- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:34px}
.page-head .sub{color:var(--grey-2);font-size:14px;margin-top:4px}
.stat{color:var(--grey-1);font-weight:600}

/* ---- Table ---- */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-family:var(--display);font-weight:700;letter-spacing:1px;text-transform:uppercase;
  font-size:12px;color:var(--grey-2);padding:14px 16px;border-bottom:1px solid var(--line);background:var(--black-2)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.swatch{width:40px;height:40px;border-radius:9px;border:1px solid var(--line-bright);flex:0 0 auto}
.pname{font-weight:600}
.pmeta{color:var(--grey-2);font-size:12.5px}
.price{font-weight:700}
.price .old{color:var(--grey-3);text-decoration:line-through;font-weight:400;font-size:12px;margin-left:6px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;
  letter-spacing:.5px;border:1px solid var(--line-bright);color:var(--grey-1)}
.pill.new{color:#7fe0af;border-color:#1a6b45}
.pill.used{color:#e6c07f;border-color:#6b551a}
.row-actions{display:flex;gap:8px;justify-content:flex-end}
.empty{padding:50px 20px;text-align:center;color:var(--grey-2)}
.loading{padding:50px 20px;text-align:center;color:var(--grey-2)}

/* ---- Modal ---- */
.modal-back{position:fixed;inset:0;z-index:40;background:rgba(4,4,6,.7);backdrop-filter:blur(4px);
  display:grid;place-items:start center;padding:40px 16px;overflow:auto}
.modal{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line-bright);
  border-radius:18px;box-shadow:0 40px 100px -40px #000}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;
  border-bottom:1px solid var(--line)}
.modal-head h2{font-size:24px}
.modal-close{width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--grey-1);
  font-size:20px;line-height:1;display:grid;place-items:center}
.modal-close:hover{background:var(--red-deep);color:#fff}
.modal-body{padding:22px 24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:12px;padding:18px 24px;border-top:1px solid var(--line)}
.preview-media{height:90px;border-radius:10px;border:1px solid var(--line-bright)}

@media(max-width:720px){
  .grid2{grid-template-columns:1fr}
  .page-head h1{font-size:28px}
  .hide-sm{display:none}
  .wrap{padding:20px 14px 60px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="assets/logo.png" alt="FBT Outlet" onerror="this.style.display='none'">
    <div>
      <div class="brand-txt">FBT<span>.</span></div>
      <div class="brand-sub">Panel administratora</div>
    </div>
  </div>
  <div class="top-actions">
    <a class="btn btn-ghost btn-sm" href="index.html" target="_blank" rel="noopener">Podgląd sklepu ↗</a>
    <button id="logout-btn" class="btn btn-ghost btn-sm hidden">Wyloguj</button>
  </div>
</div>

<!-- LOGIN -->
<section id="login-view" class="login-shell hidden">
  <form id="login-form" class="login-card">
    <h1>Logowanie</h1>
    <p>Wprowadź hasło administratora, aby zarządzać produktami.</p>
    <div id="login-error" class="notice notice-err hidden"></div>
    <div class="field">
      <label for="password">Hasło</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center">Zaloguj się</button>
  </form>
</section>

<!-- PANEL -->
<main id="panel-view" class="wrap hidden">
  <div class="page-head">
    <div>
      <h1>Produkty</h1>
      <div class="sub">Dodawaj, edytuj i usuwaj produkty widoczne w sklepie.</div>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="stat"><span id="count">0</span> produktów</span>
      <button id="add-btn" class="btn btn-primary">+ Dodaj produkt</button>
    </div>
  </div>

  <div id="panel-notice"></div>

  <div class="table-wrap">
    <table class="tbl">
      <thead>
        <tr>
          <th style="width:56px"></th>
          <th>Produkt</th>
          <th class="hide-sm">Kategoria</th>
          <th class="hide-sm">Stan</th>
          <th>Cena</th>
          <th style="text-align:right">Akcje</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6" class="loading">Ładowanie…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- EDIT / ADD MODAL -->
<div id="modal" class="modal-back hidden">
  <form id="product-form" class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Nowy produkt</h2>
      <button type="button" class="modal-close" id="modal-close" aria-label="Zamknij">×</button>
    </div>
    <div class="modal-body">
      <div id="form-error" class="notice notice-err hidden"></div>
      <input type="hidden" id="f-id">
      <div class="field">
        <label for="f-name">Nazwa</label>
        <input type="text" id="f-name" required>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-brand">Marka</label>
          <input type="text" id="f-brand" required>
        </div>
        <div class="field">
          <label for="f-cat">Kategoria</label>
          <select id="f-cat"></select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-price">Cena (zł)</label>
          <input type="number" id="f-price" min="0" step="1" required>
        </div>
        <div class="field">
          <label for="f-old">Cena przed (zł, opcjonalnie)</label>
          <input type="number" id="f-old" min="0" step="1">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-condition">Stan</label>
          <select id="f-condition"></select>
        </div>
        <div class="field">
          <label for="f-stars">Ocena (1–5)</label>
          <input type="number" id="f-stars" min="1" max="5" step="1" value="5">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-tag">Etykieta (np. -30%, HIT)</label>
          <input type="text" id="f-tag">
        </div>
        <div class="field">
          <label for="f-tagType">Typ etykiety</label>
          <select id="f-tagType">
            <option value="sale">Promocja (czerwona)</option>
            <option value="hit">HIT</option>
            <option value="new">Nowość</option>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="f-sizes">Rozmiary (po przecinku)</label>
          <input type="text" id="f-sizes" placeholder="S, M, L, XL">
        </div>
        <div class="field">
          <label for="f-colors">Kolory (po przecinku)</label>
          <input type="text" id="f-colors" placeholder="Czarny, Czerwony">
        </div>
      </div>
      <div class="field">
        <label for="f-gradient">Tło kafelka (CSS gradient)</label>
        <input type="text" id="f-gradient" placeholder="linear-gradient(135deg,#2a0409,#1c1c22)">
        <div class="hint">Podgląd tła produktu w sklepie:</div>
        <div id="grad-preview" class="preview-media" style="margin-top:8px"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="cancel-btn">Anuluj</button>
      <button type="submit" class="btn btn-primary" id="save-btn">Zapisz</button>
    </div>
  </form>
</div>

<script src="js/admin.js"></script>
</body>
</html>
